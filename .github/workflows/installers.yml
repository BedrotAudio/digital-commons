# Builds the Windows installer and the macOS disk images, installs each one on a clean
# machine as a person would, and runs it: in a real console in demo mode, then a first
# start that has to install Ollama, turn off its cloud access and download a small model,
# then one real chat through the installed gateway, then on Windows an uninstall.
# A version tag also makes a draft release with the installers, for a person to check
# and publish. Actions are pinned to the same exact commits as tests.yml.

name: Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            runner: windows-latest
            target: windows-x64
          - name: Mac installer, Apple Silicon
            runner: macos-latest
            target: macos-arm64
          - name: Mac installer, Intel
            runner: macos-26-intel
            target: macos-x64
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: terminal/go.sum

      - name: Build the installer
        run: python installer/build.py

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.target }}
          path: dist/DigitalCommons-*
          if-no-files-found: error
          retention-days: 14

      - name: Install it on Windows, as the wizard would
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\DigitalCommons-*-setup.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Digital Commons"
          if (-not (Test-Path "$app\runtime\python.exe")) { throw "Digital Commons was not installed in $app" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Digital Commons.lnk'
          if (-not (Test-Path $shortcut)) { throw "The Start menu shortcut is missing" }
          "DC_APP=$app" >> $env:GITHUB_ENV
          "DC_PYTHON=$app\runtime\python.exe" >> $env:GITHUB_ENV

      - name: Install it on a Mac, as dragging it to Applications would
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/Applications"
          hdiutil attach dist/DigitalCommons-*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/image"
          ditto "$RUNNER_TEMP/image/Digital Commons.app" "$HOME/Applications/Digital Commons.app"
          hdiutil detach "$RUNNER_TEMP/image"
          bundle="$HOME/Applications/Digital Commons.app"
          plutil -lint "$bundle/Contents/Info.plist"
          test -x "$bundle/Contents/MacOS/Digital Commons"
          test -x "$bundle/Contents/Resources/app/start.command"
          echo "DC_APP=$bundle/Contents/Resources/app" >> "$GITHUB_ENV"
          echo "DC_PYTHON=$bundle/Contents/Resources/app/runtime/bin/python3" >> "$GITHUB_ENV"

      - name: Choose the folders for this run
        run: |
          echo "DC_DATA_DIR=$RUNNER_TEMP/dc-data" >> "$GITHUB_ENV"
          echo "DC_MODELS_CONFIG=$GITHUB_WORKSPACE/tests/ci/models-tiny.yaml" >> "$GITHUB_ENV"

      - name: Run the installed copy in a real console, in demo mode
        working-directory: terminal
        env:
          DC_E2E: "1"
          DC_E2E_SCREENS: ${{ github.workspace }}/screens
        run: DC_E2E_INSTALL_DIR="$DC_APP" go test ./internal/e2e/ -run 'TestInstalledCopy$' -count=1 -v -timeout 10m

      - name: First start on a machine without Ollama
        timeout-minutes: 30
        run: '"$DC_PYTHON" "$DC_APP/dc.py" start --prepare-only --yes'

      - name: One real chat through the installed gateway
        timeout-minutes: 20
        run: |
          "$DC_PYTHON" "$DC_APP/dc.py" backend > "$RUNNER_TEMP/gateway.log" 2>&1 &
          curl --silent --fail --output /dev/null --retry 60 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8000/healthz
          python tests/ci/live_check.py --wait 600

      - name: Stop the gateway
        if: always()
        run: '"$DC_PYTHON" "$DC_APP/dc.py" stop || true'

      - name: Uninstall it on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath "$env:DC_APP\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $env:DC_APP) { Get-ChildItem -Recurse $env:DC_APP | Select-Object -First 20 FullName; throw "The uninstaller left files behind" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Digital Commons.lnk'
          if (Test-Path $shortcut) { throw "The uninstaller left the Start menu shortcut" }

      - name: Keep the screens and the gateway log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-${{ matrix.target }}
          path: |
            screens
            ${{ runner.temp }}/gateway.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show the gateway log
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/gateway.log" || true

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Make a draft release for a person to check and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY" --draft --prerelease
          --title "Digital Commons $GITHUB_REF_NAME (beta)"
          --notes "Beta software. Not approved for production use or sensitive data.
          The installers are not code-signed yet. See Install in README.md."
